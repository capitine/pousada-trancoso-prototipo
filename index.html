// ---- WebGL "3D photo": each photo + its depth map; the camera dollies and pans, near pixels move more than far ones

const VS=`attribute vec2 p;varying vec2 v;void main(){v=p*.5+.5;gl_Position=vec4(p,0,1);}`;
const FS=`precision highp float;varying vec2 v;
uniform sampler2D tA,dA,tB,dB;uniform vec4 fA,fB;uniform vec2 pA,pB,res;uniform float zA,zB,mixv,time;
vec2 fit(vec2 q,vec4 f){return vec2(.5)+q*f.xy+f.zw;}
vec3 scene(sampler2D t,sampler2D d,vec4 f,vec2 uv,float z,vec2 pan){

  return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1)),f.x),f.y);}

  ['tA','dA','tB','dB','fA','fB','pA','pB','res','zA','zB','mixv','time'].forEach(k=>U[k]=gl.getUniformLocation(prog,k));

    const o=inside?Math.min(i?ease(u/.12):1, last?1:ease((1-u)/.12)):(last&&p>c.end?1:0);
    const {t,pols}=els[i];
    t.style.opacity=o.toFixed(3); t.style.translate=reduce?'0':`0 ${((1-o)*14).toFixed(1)}px`;
    t.style.pointerEvents=o>.6?'auto':'none';
    pols.forEach((q,k)=>{q.style.opacity=o.toFixed(3); q.style.transform=`rotate(${q.dataset.r}deg) translateY(${((1-o)*26+k*6).toFixed(1)}px)`});
  });
  const cur=CH.reduce((a,c,i)=>p>=c.start-LINK/2?i:a,0);
  if(cur!==active){ active=cur; const c=CH[cur], label=`${String(cur+1).padStart(2,'0')} — ${c.short}`;
    $('status').textContent=label; $('now').textContent=label; els.forEach((e,i)=>e.b.classList.toggle('on',i===cur)); }
  $('bar').style.transform=`scaleX(${(p/TOTAL).toFixed(4)})`;
  $('hint').style.opacity=p>.15?0:1;
  dirty=true;
}
resize();
(function loop(ms){
  const d=target-pos;
  if(Math.abs(d)>.0004){ pos+=d*(reduce?.15:.1); draw(pos); }
  render(pos,(ms||0)/1000);         // always redraw: the gentle sway keeps the photo alive while you read
  requestAnimationFrame(loop);
})();
draw(0);
</script>
</body>
</html>
