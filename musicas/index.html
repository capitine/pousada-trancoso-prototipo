<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Músicas da Pousada Trancoso</title>
<style>
:root{--paper:#f6efe2;--night:#14110f;--coral:#e0684b;--gold:#d9b46a;--muted:#b9ad9b}
*{box-sizing:border-box;margin:0}
body{background:var(--night);color:var(--paper);font:400 16px/1.5 system-ui,sans-serif;padding:22px 16px 140px;max-width:640px;margin:0 auto}
h1{font:600 28px Georgia,serif}
.lead{color:var(--muted);font-size:14px;margin:4px 0 18px}
.all{display:block;width:100%;padding:14px;border:0;border-radius:99px;background:var(--coral);color:#fff;font:600 16px system-ui;margin-bottom:18px}
ol{list-style:none;padding:0}
li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid rgba(246,239,226,.12)}
li button{flex:1;text-align:left;background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:0}
li b{display:block;font:600 16px Georgia,serif}li small{color:var(--gold);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
li.now b{color:var(--coral)}
li a{color:var(--paper);text-decoration:none;border:1px solid rgba(246,239,226,.35);border-radius:99px;padding:6px 12px;font-size:13px;white-space:nowrap}
.player{position:fixed;left:0;right:0;bottom:0;background:#201a17;padding:10px 16px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.4)}
.player div{max-width:640px;margin:0 auto}.player p{font-size:13px;color:var(--muted);margin-bottom:6px}
audio{width:100%}
</style>
</head>
<body>
<h1>Músicas da Pousada Trancoso</h1>
<p class="lead">Toque em "Tocar tudo" e deixe rodar na caixa de som (Bluetooth). Ou baixe cada música no celular.</p>
<button class="all" id="all">▶ Tocar tudo</button>
<ol id="list"></ol>
<div class="player"><div><p id="now">Escolha uma música</p><audio id="a" controls preload="none"></audio></div></div>
<script>
// same album order as the site's player; one <audio> so it keeps playing with the screen off and works with Bluetooth speakers
const S=[["PT-017-B", "Mais Um Pouquinho", "pagode · cantada"], ["PT-015-B", "Luz de Velas", "bossa · cantada"], ["PT-016-B", "Moqueca É Capixaba", "baião · cantada"], ["PT-020-B", "Na Sombra da Castanheira", "samba-canção · cantada"], ["PT-018-B", "Tempo Pra Nós Dois", "bossa · MPB · cantada"], ["PT-012-B", "Vem pro Trancoso", "axé · cantada"], ["PT-014-B", "Domingo de Roda", "pagode · cantada"], ["PT-006-A", "Maré de Setiba", "bossa nova"], ["PT-007-A", "Roda em Setiba", "samba de roda"], ["PT-009-A", "Ijexá do Entardecer", "ijexá"], ["PT-008-A", "Baião da Varanda", "baião"], ["PT-001b-A", "Violão de Meaípe", "violão"], ["PT-010-A", "Forró da Lua Cheia", "forró"], ["PT-007-B", "Samba das Três Praias", "samba de roda"], ["PT-006-B", "Brisa da Restinga", "bossa nova"], ["PT-009-B", "Lagoa Escura", "ijexá"], ["PT-008-B", "Pé na Areia", "baião"], ["PT-001b-B", "Céu de Peracanga", "violão"], ["PT-010-B", "Poeira da Restinga", "forró"], ["PT-012-A", "Vem pro Trancoso · versão 2", "axé · cantada"], ["bonus-um-pouquinho-mais", "Um Pouquinho Mais", "pagode · faixa bônus"]];
const url=f=>`../audio/songs/${f}.mp3`, a=document.getElementById('a'); let i=-1;
document.getElementById('list').innerHTML=S.map(([f,n,st],k)=>`<li><button data-k="${k}"><b>${k+1}. ${n}</b><small>${st}</small></button><a href="${url(f)}" download="${n}.mp3">Baixar</a></li>`).join('');
function play(k){ i=(k+S.length)%S.length; a.src=url(S[i][0]); a.play().catch(()=>{});
  document.getElementById('now').textContent=`${i+1}/${S.length} · ${S[i][1]}`;
  document.querySelectorAll('li').forEach((li,j)=>li.classList.toggle('now',j===i));
  if('mediaSession' in navigator) navigator.mediaSession.metadata=new MediaMetadata({title:S[i][1],artist:'Pousada Trancoso',album:'Músicas da Pousada'}); }
document.getElementById('list').onclick=e=>{ const b=e.target.closest('button'); if(b) play(+b.dataset.k); };
document.getElementById('all').onclick=()=>play(0);
a.onended=()=>play(i+1);   // the whole album in a row
if('mediaSession' in navigator){ navigator.mediaSession.setActionHandler('nexttrack',()=>play(i+1)); navigator.mediaSession.setActionHandler('previoustrack',()=>play(i-1)); }
</script>
</body>
</html>
